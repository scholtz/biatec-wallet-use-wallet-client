name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm publint
      - run: pnpm format:check

  examples:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        example: [vanilla-ts, react-ts]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Examples depend on the adapter via workspace:*, so it must be built first.
      - run: pnpm build
      - run: pnpm --filter example-${{ matrix.example }} exec tsc --noEmit
      - run: pnpm --filter example-${{ matrix.example }} build

  changeset-check:
    # Advisory only: reminds contributors to add a changeset for user-facing changes,
    # without blocking docs-only / internal PRs that don't need one.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check for a changeset
        run: |
          if ! pnpm changeset status --since=origin/${{ github.base_ref }} 2>&1 | tee /tmp/status.log; then
            echo "::warning::No changeset found for this PR. If it changes the published package, run 'pnpm changeset' and commit the result. See CONTRIBUTING.md#releasing."
          fi

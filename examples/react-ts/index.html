<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biatec Wallet × use-wallet React example</title>
    <meta
      name="description"
      content="Minimal React dApp using @txnlab/use-wallet-react with the Biatec Wallet adapter"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f1f5f9;
        --bg-accent: #ecfeff;
        --card-bg: rgba(255, 255, 255, 0.72);
        --card-border: rgba(15, 23, 42, 0.08);
        --text: #0f172a;
        --muted: #64748b;
        --accent: #0f766e;
        --accent-soft: rgba(15, 118, 110, 0.12);
        --shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --bg-accent: #0f172a;
          --card-bg: rgba(255, 255, 255, 0.04);
          --card-border: rgba(255, 255, 255, 0.08);
          --text: #f1f5f9;
          --muted: #94a3b8;
          --accent: #2dd4bf;
          --accent-soft: rgba(45, 212, 191, 0.14);
          --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background:
          radial-gradient(circle at 15% -10%, var(--bg-accent), transparent 55%), var(--bg);
        background-attachment: fixed;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biatec Wallet × use-wallet Vue example</title>
    <meta
      name="description"
      content="Minimal Vue dApp using @txnlab/use-wallet-vue with the Biatec Wallet adapter"
    />
    <script>
      // Applied before first paint (and before Vue mounts) so the page never flashes the
      // wrong theme on reload — reads the choice made by <ThemeToggle> in src/ThemeToggle.vue.
      ;(function () {
        try {
          var stored = localStorage.getItem('biatec-example-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch {
          /* localStorage unavailable (e.g. private mode) — fall back to system preference */
        }
      })()
    </script>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f1f5f9;
        --bg-accent: #ecfeff;
        --card-bg: rgba(255, 255, 255, 0.72);
        --card-border: rgba(15, 23, 42, 0.08);
        --text: #0f172a;
        --muted: #64748b;
        --accent: #0f766e;
        --accent-soft: rgba(15, 118, 110, 0.12);
        --shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0b1220;
          --bg-accent: #0f172a;
          --card-bg: rgba(255, 255, 255, 0.04);
          --card-border: rgba(255, 255, 255, 0.08);
          --text: #f1f5f9;
          --muted: #94a3b8;
          --accent: #2dd4bf;
          --accent-soft: rgba(45, 212, 191, 0.14);
          --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        }
      }
      /* An explicit choice from <ThemeToggle> always wins, in either direction. */
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #0b1220;
        --bg-accent: #0f172a;
        --card-bg: rgba(255, 255, 255, 0.04);
        --card-border: rgba(255, 255, 255, 0.08);
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #2dd4bf;
        --accent-soft: rgba(45, 212, 191, 0.14);
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
      :root[data-theme='light'] {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background:
          radial-gradient(circle at 15% -10%, var(--bg-accent), transparent 55%), var(--bg);
        background-attachment: fixed;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
